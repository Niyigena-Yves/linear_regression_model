[project]
name = "linear-regression-model"
version = "1.0.0"
description = "Business Registration Time Predictor: regression model, FastAPI service, and Flutter client for the Doing Business dataset."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.140.0",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "scikit-learn==1.8.0",
    "numpy==2.4.4",
    "joblib==1.5.3",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "requests>=2.32",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["summative"]
