services:
  - type: web
    name: business-registration-predictor
    runtime: python
    plan: free
    rootDir: summative/API
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn prediction:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
